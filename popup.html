<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redactor</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="header-row">
        <h1>Redactor</h1>
        <button
          type="button"
          id="settings-btn"
          class="icon-btn"
          title="Settings"
          aria-label="Settings"
          aria-expanded="false"
          aria-controls="settings-panel"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path
              fill="currentColor"
              d="M19.14 12.94a7.07 7.07 0 0 0 .05-.94 7.07 7.07 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.67 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.4 7.4 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.05.24.25.42.49.42h3.84c.24 0 .45-.18.49-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.22.08.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"
            />
          </svg>
        </button>
      </div>
      <p class="subtitle">Hide YouTube videos and Reddit posts whose titles contain your keywords.</p>
    </header>

    <section id="settings-panel" class="settings" hidden>
      <h2>Sites</h2>
      <p class="settings-hint">Redact titles on:</p>
      <div id="site-list"></div>
    </section>

    <form id="add-form">
      <input
        type="text"
        id="keyword-input"
        placeholder="Add a title keyword…"
        autocomplete="off"
        maxlength="100"
      />
      <button type="submit" id="add-btn">Add</button>
    </form>

    <input
      type="search"
      id="search-input"
      placeholder="Search your list…"
      autocomplete="off"
    />

    <ul id="keyword-list"></ul>
    <p id="empty-msg" class="empty">No keywords yet.</p>

    <script src="popup.js"></script>
  </body>
</html>
